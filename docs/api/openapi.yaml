openapi: 3.1.0
info:
  title: Pacaembu Orbit CRM API
  version: 0.1.0
  description: |
    Contrato executável do ciclo preparatório do CRM. O papel vem da
    membership ativa no workspace; valores de identidade enviados pelo cliente
    não são usados para autorização. WhatsApp, outbox, aprovação e pairing
    pertencem ao roadmap posterior.
servers:
  - url: /
    description: Mesmo domínio do CRM Web em cada ambiente
tags:
  - name: Auth
  - name: Leads
  - name: Conversations
  - name: Agents
security:
  - sessionCookie: []
paths:
  /api/auth/login:
    post:
      operationId: login
      security: []
      tags: [Auth]
      summary: Cria uma sessão autenticada
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /api/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Encerra a sessão atual
      responses:
        '204': { description: Sessão encerrada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Retorna o usuário e o workspace atual
      responses:
        '200':
          description: Contexto autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/leads:
    get:
      operationId: listLeads
      tags: [Leads]
      summary: Lista leads dentro do escopo autorizado
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/Stage' }
      responses:
        '200':
          description: Página de leads
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createLead
      tags: [Leads]
      summary: Cria um lead na carteira do corretor autenticado
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadRequest' }
      responses:
        '201':
          description: Lead criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/leads/{leadId}:
    parameters: [{ $ref: '#/components/parameters/LeadId' }]
    get:
      operationId: getLead
      tags: [Leads]
      summary: Retorna um lead autorizado
      responses:
        '200':
          description: Lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateLead
      tags: [Leads]
      summary: Atualiza campos permitidos do lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLeadRequest' }
      responses:
        '200':
          description: Lead atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      summary: Lista conversas autorizadas
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200':
          description: Página de conversas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createConversation
      tags: [Conversations]
      summary: Abre uma conversa para um lead autorizado
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationRequest' }
      responses:
        '201':
          description: Conversa criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/conversations/{conversationId}:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      operationId: getConversation
      tags: [Conversations]
      summary: Retorna uma conversa autorizada
      responses:
        '200':
          description: Conversa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/conversations/{conversationId}/messages:
    parameters: [{ $ref: '#/components/parameters/ConversationId' }]
    get:
      operationId: listConversationMessages
      tags: [Conversations]
      summary: Lista mensagens da conversa
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Mensagens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      summary: Lista Agents liberados para o workspace
      responses:
        '200':
          description: Agents disponíveis
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/agent-sessions:
    post:
      operationId: createAgentSession
      tags: [Agents]
      summary: Abre uma sessão isolada de Agent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentSessionRequest' }
      responses:
        '201':
          description: Sessão criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/agent-sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      operationId: getAgentSession
      tags: [Agents]
      summary: Retorna uma sessão de Agent autorizada
      responses:
        '200':
          description: Sessão com execuções
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/agent-sessions/{sessionId}/messages:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    post:
      operationId: sendAgentMessage
      tags: [Agents]
      summary: Envia uma tarefa para a sessão do Agent
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentMessageRequest' }
      responses:
        '202':
          description: Execução aceita; o estado final chega por eventos e não é inferido nesta resposta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/agent-sessions/{sessionId}/events:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    get:
      operationId: streamAgentEvents
      tags: [Agents]
      summary: Transmite eventos autorizados por SSE
      description: |
        Eventos têm id `<run_id>:<sequence>`. `Last-Event-ID` retoma eventos
        posteriores. Um cursor expirado responde 410 e um cursor inválido 422.
      parameters:
        - name: run_id
          in: query
          required: false
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string, pattern: '^[^:]+:[1-9][0-9]*$' }
      responses:
        '200':
          description: Fluxo de eventos
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/EventReplayUnavailable' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/ServerShuttingDown' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: crm_session
      description: Cookie HttpOnly, Secure fora do ambiente local e SameSite=Lax.
  parameters:
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    Stage:
      name: stage
      in: query
      schema: { $ref: '#/components/schemas/LeadStage' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    Unauthorized:
      description: Sessão ausente, inválida ou membership suspensa
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    Forbidden:
      description: Ação fora do escopo permitido (CSRF_ORIGIN_REQUIRED ou CSRF_ORIGIN_INVALID)
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    NotFound:
      description: Recurso não encontrado no escopo autorizado
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    Conflict:
      description: Estado incompatível, workspace ambíguo ou idempotência conflitante
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    ValidationError:
      description: Dados inválidos, inclusive INVALID_EVENT_CURSOR
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    RateLimited:
      description: Muitas tentativas
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    EventReplayUnavailable:
      description: EVENT_REPLAY_UNAVAILABLE após a retenção de sete dias
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    ServerShuttingDown:
      description: API em encerramento antes de abrir o fluxo (SERVER_SHUTTING_DOWN, retryable)
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
    ServiceUnavailable:
      description: Hermes indisponível (HERMES_PROFILE_UNAVAILABLE)
      content:
        application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id, retryable]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 256, writeOnly: true }
        workspace_id: { type: string, format: uuid }
    SessionUser:
      type: object
      required: [id, membership_id, name, email, role, workspace_id, broker_id]
      properties:
        id: { type: string, format: uuid }
        membership_id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [broker, supervisor] }
        workspace_id: { type: string, format: uuid }
        broker_id: { type: [string, 'null'], format: uuid }
    PageInfo:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    LeadStage:
      type: string
      enum: [novo, contato, visita, proposta, aprovado, perdido]
    Lead:
      type: object
      required: [id, broker_id, name, phone, email, source, interest, next_action, stage, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        broker_id: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], format: email }
        source: { type: [string, 'null'], maxLength: 80 }
        interest: { type: [string, 'null'], maxLength: 160 }
        next_action: { type: [string, 'null'], maxLength: 200 }
        stage: { $ref: '#/components/schemas/LeadStage' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateLeadRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], format: email }
        source: { type: [string, 'null'], maxLength: 80 }
        interest: { type: [string, 'null'], maxLength: 160 }
    UpdateLeadRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: [string, 'null'], maxLength: 40 }
        email: { type: [string, 'null'], format: email }
        stage: { $ref: '#/components/schemas/LeadStage' }
        interest: { type: [string, 'null'], maxLength: 160 }
        next_action: { type: [string, 'null'], maxLength: 200 }
    LeadPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Lead' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    CreateConversationRequest:
      type: object
      required: [lead_id]
      properties:
        lead_id: { type: string, format: uuid }
        title: { type: string, maxLength: 160 }
    Conversation:
      type: object
      required: [id, broker_id, lead_id, status, last_message_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        broker_id: { type: string, format: uuid }
        lead_id: { type: string, format: uuid }
        status: { type: string, enum: [open, waiting, closed, archived] }
        last_message_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConversationPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Message:
      type: object
      required: [id, conversation_id, direction, author, status, content, occurred_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        direction: { type: string, enum: [inbound, outbound] }
        author: { type: string, enum: [lead, broker, agent, system] }
        status: { type: string, enum: [received, processing, draft, failed] }
        content: { type: string, minLength: 1, maxLength: 12000 }
        occurred_at: { type: string, format: date-time }
    MessagePage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Message' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Agent:
      type: object
      required: [id, name, description, status, capabilities]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [online, degraded, disabled] }
        capabilities: { type: array, items: { type: string } }
    CreateAgentSessionRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string }
        lead_id: { type: [string, 'null'], format: uuid }
        conversation_id: { type: [string, 'null'], format: uuid }
        title: { type: [string, 'null'], maxLength: 160 }
    AgentMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 12000 }
        client_message_id: { type: string, maxLength: 128 }
    AgentResult:
      type: object
      required: [type, content, citations, proposed_actions, requires_approval, status, request_id]
      properties:
        type: { type: string, enum: [draft, error] }
        content: { type: string }
        citations: { type: array, items: { type: string } }
        proposed_actions: { type: array, maxItems: 0, items: {} }
        requires_approval: { type: boolean, const: false }
        status: { type: string, enum: [completed, failed, cancelled] }
        request_id: { type: string }
    AgentRun:
      type: object
      required: [run_id, session_id, status, input_content, result, error_code, created_at, updated_at]
      properties:
        run_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        input_content: { type: string }
        result: { oneOf: [{ $ref: '#/components/schemas/AgentResult' }, { type: 'null' }] }
        error_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AgentRunAccepted:
      type: object
      required: [run_id, session_id, status]
      properties:
        run_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [queued, running] }
    AgentSession:
      type: object
      required: [id, agent_id, lead_id, conversation_id, title, status, runs, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string }
        lead_id: { type: [string, 'null'], format: uuid }
        conversation_id: { type: [string, 'null'], format: uuid }
        title: { type: string }
        status: { type: string, enum: [active, stopped, completed, failed] }
        runs: { type: array, items: { $ref: '#/components/schemas/AgentRun' } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PersistedAgentEvent:
      type: object
      required: [id, run_id, session_id, workspace_id, broker_id, sequence, type, payload, request_id, occurred_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        session_id: { type: string }
        workspace_id: { type: string }
        broker_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
        request_id: { type: string }
        occurred_at: { type: string, format: date-time }
    AgentEvent:
      type: object
      required: [id, run_id, session_id, workspace_id, broker_id, sequence, type, data, request_id, occurred_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        session_id: { type: string }
        workspace_id: { type: string }
        broker_id: { type: string }
        sequence: { type: integer, minimum: 1 }
        type: { type: string }
        data: { type: object, additionalProperties: true }
        request_id: { type: string }
        occurred_at: { type: string, format: date-time }

x-error-codes:
  - WORKSPACE_CONTEXT_REQUIRED
  - CSRF_ORIGIN_REQUIRED
  - CSRF_ORIGIN_INVALID
  - IDEMPOTENCY_KEY_REUSED
  - EVENT_REPLAY_UNAVAILABLE
  - INVALID_EVENT_CURSOR
  - HERMES_PROFILE_UNAVAILABLE
