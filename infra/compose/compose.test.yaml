services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pacaembu_test
      POSTGRES_USER: pacaembu_owner
      POSTGRES_PASSWORD: pacaembu_owner
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./init-test.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacaembu_owner -d pacaembu_test"]
      interval: 2s
      timeout: 2s
      retries: 20
