name: pacaembu-crm
services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    environment:
      POSTGRES_DB: pacaembu
      POSTGRES_USER: pacaembu_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-dev.sh:/docker-entrypoint-initdb.d/10-init-dev.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacaembu_owner -d pacaembu"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://pacaembu_owner:${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}@postgres:5432/pacaembu
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: ["pnpm", "db:seed"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pacaembu_owner:${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}@postgres:5432/pacaembu
      SEED_SUPERVISOR_EMAIL: ${SEED_SUPERVISOR_EMAIL:?set SEED_SUPERVISOR_EMAIL}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD:?set SEED_SUPERVISOR_PASSWORD}
      SEED_BROKER_EMAIL: ${SEED_BROKER_EMAIL:?set SEED_BROKER_EMAIL}
      SEED_BROKER_PASSWORD: ${SEED_BROKER_PASSWORD:?set SEED_BROKER_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://pacaembu_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD}@postgres:5432/pacaembu
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      API_HOST: 0.0.0.0
      API_PORT: 3001
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  proxy:
    image: nginx:stable-alpine@sha256:ef8676b33d681f272ba429b27658bdd7e640963279714c96bddf1dc76307f7b6
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - ../reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
