name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pacaembu_owner:pacaembu_owner@127.0.0.1:55432/pacaembu_test
      DATABASE_URL_TEST: postgresql://pacaembu_app:pacaembu_app@127.0.0.1:55432/pacaembu_test
      DATABASE_URL_TEST_OWNER: postgresql://pacaembu_owner:pacaembu_owner@127.0.0.1:55432/pacaembu_test
      APP_ORIGIN: http://127.0.0.1:8080
      DB_OWNER_PASSWORD: ci-owner-password
      DB_APP_PASSWORD: ci-app-password
      SEED_SUPERVISOR_EMAIL: supervisor.ci@example.test
      SEED_SUPERVISOR_PASSWORD: ci-supervisor-password
      SEED_BROKER_EMAIL: broker.ci@example.test
      SEED_BROKER_PASSWORD: ci-broker-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - run: npm install -g pnpm@11.27.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: docker compose -f infra/compose/compose.test.yaml up -d --wait
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:compose
      - run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose/compose.yaml config --quiet
      - run: git diff --check
      - if: always()
        run: docker compose -f infra/compose/compose.test.yaml down -v --remove-orphans
