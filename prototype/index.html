<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003d4c" />
    <title>Pacaembu Orbit — CRM de Vendas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@400;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=16" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand-lockup">
          <div class="brand-mark"><span></span><span></span><span></span></div>
          <div>
            <strong>PACAEMBU</strong>
            <small>ORBIT CRM</small>
          </div>
        </div>

        <button class="workspace-switcher" type="button" data-toast="Seletor de equipe disponível no ambiente conectado">
          <span class="avatar avatar-blue">RF</span>
          <span class="workspace-copy"><strong>Equipe Horizonte</strong><small>Ambiente de vendas</small></span>
          <span class="workspace-chevron">⌄</span>
        </button>

        <div class="nav-label">Workspace</div>
        <nav class="main-nav" aria-label="Navegação principal">
          <button class="nav-item active" data-view="dashboard"><span class="nav-glyph">▦</span><span>Visão geral</span><kbd>G</kbd></button>
          <button class="nav-item" data-view="leads"><span class="nav-glyph">♙</span><span>Leads e clientes</span><span class="nav-badge">24</span></button>
          <button class="nav-item" data-view="agents"><span class="nav-glyph">✦</span><span>Agents</span><span class="live-dot"></span></button>
          <button class="nav-item" data-view="performance"><span class="nav-glyph">◒</span><span>Performance</span></button>
          <button class="nav-item" data-view="property"><span class="nav-glyph">⌂</span><span>Imóveis</span></button>
          <button class="nav-item" data-view="documents"><span class="nav-glyph">▰</span><span>Documentos</span></button>
        </nav>

        <div class="nav-label nav-label-space">Gestão</div>
        <nav class="main-nav">
          <button class="nav-item" data-view="management"><span class="nav-glyph">◈</span><span>Gestão da equipe</span></button>
          <button class="nav-item" data-view="settings"><span class="nav-glyph">⚙</span><span>Configurações</span></button>
        </nav>

        <div class="sidebar-spacer"></div>
        <div class="sidebar-help">
          <div class="help-icon">?</div>
          <div><strong>Precisa de ajuda?</strong><small>Fale com o suporte</small></div>
          <button type="button" data-toast="Suporte em breve">↗</button>
        </div>
        <div class="profile-card">
          <span class="avatar avatar-green">RF</span>
          <span><strong>Renato Faria</strong><small>Supervisor</small></span>
          <button type="button" data-toast="Menu de conta">•••</button>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu" type="button" aria-label="Abrir menu">☰</button>
          <div class="breadcrumbs"><span>Workspace</span><span class="crumb-separator">/</span><strong id="breadcrumbCurrent">Visão geral</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><span class="search-symbol">⌕</span><input id="globalSearch" type="search" placeholder="Buscar no CRM" /><kbd>⌘ K</kbd></label>
            <button class="icon-button notification-button" type="button" data-toast="Você tem 4 notificações novas">◔<i></i></button>
            <div class="topbar-divider"></div>
            <span class="status-pill"><i></i> Sistema online</span>
          </div>
        </header>
        <div id="app"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot"></div>
    <script src="./state.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
